# 테스트: DB·Redis는 Testcontainers가 띄운다 (TestContainersConfig). 실제 football-svc는 부르지 않는다
travel.football.backfill-on-start=false
travel.admin.key=test-admin-key
# OSM(Overpass)은 부르지 않는다 — 가져오기 테스트는 가짜 서버로 (OsmImportTest)
travel.osm.import-on-start=false
travel.osm.scheduled=false
travel.osm.retry-base-ms=10
travel.fx.gbp-krw=1800
travel.football.backfill-retry-base-ms=10
