spring.application.name=travel-svc

# 로컬에서 factos-BE(8080)와 같이 띄우므로 기본 8090. compose 안에서도 8090
server.port=${PORT:8090}
server.forward-headers-strategy=framework

# ── 자기 DB (factos-BE와 다른 DB) ─────────────────────────────
# PostGIS가 필요하다. 로컬: docker run -p 5433:5432 -e POSTGRES_PASSWORD=travel -e POSTGRES_USER=travel -e POSTGRES_DB=travel imresamu/postgis:16-3.5
spring.datasource.url=jdbc:postgresql://${TRAVEL_DB_HOST:localhost}:${TRAVEL_DB_PORT:5433}/${TRAVEL_DB_NAME:travel}
spring.datasource.username=${TRAVEL_DB_USERNAME:travel}
spring.datasource.password=${TRAVEL_DB_PASSWORD:travel}

# 스키마는 Flyway(db/migration)만 바꾼다. 하이버네이트는 맞는지만 본다
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Redis (football-svc가 올리는 이벤트 스트림을 읽는다) ─────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── football-svc 연동 ───────────────────────────────────────
# REST: 처음 띄울 때 팀별 일정을 한 번 받아 온다 (이벤트는 "바뀐 것"만 오므로)
travel.football.base-url=${FOOTBALL_BASE_URL:http://localhost:8080}
travel.football.backfill-on-start=${FOOTBALL_BACKFILL_ON_START:true}
# 이벤트: Redis Stream events:match를 소비자 그룹으로 읽는다 (factos-BE docs/events.md)
travel.events.enabled=${TRAVEL_EVENTS_ENABLED:true}
travel.events.group=travel-svc

# 로그인 쿠키로 쓰는 요청(글·댓글)의 허용 출처 (CSRF). 운영은 사이트 주소 하나
travel.web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:3000}

# 관리자 API(/api/travel/admin/**) 키 — X-Admin-Key 헤더. 비면 관리자 API가 잠긴다
travel.admin.key=${TRAVEL_ADMIN_KEY:}

# 헬스체크만 연다 (nginx는 /actuator를 밖으로 내지 않는다)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 시각은 KST 오프셋(+09:00)으로 내보낸다 — football-svc API와 같은 모양
spring.jackson.time-zone=Asia/Seoul

# ── 펍 데이터: OpenStreetMap (Overpass API) ─────────────────
# 처음 뜰 때 OSM 펍이 하나도 없으면 한 번, 그 뒤 매달 1일 04:30(KST) 다시 받는다. 화면에 "© OpenStreetMap" 출처 표시 필수(ODbL)
travel.osm.overpass-url=${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
travel.osm.user-agent=factos-travel/1.0 (+${SITE_URL:https://fipa-news.kr})
travel.osm.import-on-start=${OSM_IMPORT_ON_START:true}
travel.osm.scheduled=${OSM_SCHEDULED:true}

# 경기장 가격 원화 표시: 1파운드 = 몇 원. 비우면 파운드만 보인다 (환율은 가끔 손으로 맞춘다)
travel.fx.gbp-krw=${TRAVEL_GBP_KRW:}
